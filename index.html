<title>Anarchy – création et fiche de PJ</title>
<style>
:root{--y:#FFC107;--yd:#D9A000;--yl:#FFF4CC;--yb:#FFD95A;--o:#E8710A;--od:#C85A00;--k:#212121;--g:#6b6b6b;--ln:#d9d9d9;--f:Oswald,"Arial Narrow",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#3a3a3a;color:var(--k);font:10.5px/1.27 Arial,"Helvetica Neue",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:210mm;margin:10px auto;padding:10px;background:#fff;border-radius:8px;font-size:13px}
.bar textarea{width:100%;height:56px;font:11px monospace;margin:6px 0}
.bar button,.bar label{display:inline-block;padding:7px 12px;margin:2px 4px 2px 0;border:0;border-radius:6px;background:var(--k);color:var(--y);font:inherit;cursor:pointer}
.bar button.p{background:var(--y);color:var(--k);font-weight:700}
#msg{color:#b00020;margin:4px 0}
.warn{background:#fff6e5;border-left:4px solid #e0a100;padding:6px 10px;margin:6px 0;font-size:12px}
.sheet{width:210mm;min-height:297mm;margin:10px auto;padding:8mm 9mm;background:#fff}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--y);padding-bottom:3px;margin-bottom:7px;position:relative}
h1{margin:0;font:700 26px/1 var(--f);text-transform:uppercase;letter-spacing:1px}
.sub{color:var(--g);font-size:12px;margin-top:1px}
.logo{font:700 12px var(--f);text-transform:uppercase;letter-spacing:1.5px;border:2px solid var(--yd);border-radius:6px;background:var(--yl);padding:2px 10px}
h2{margin:0 -6px 4px;padding:2px 8px;font:700 11.5px/1.2 var(--f);text-transform:uppercase;letter-spacing:1px;background:var(--yb)}
section,.fr{border:1.5px solid var(--yd);background:#fff;border-radius:8px;overflow:hidden;padding:0 6px 4px;margin-bottom:6px;break-inside:avoid}
.fr{padding:4px 6px;margin-bottom:0}
.r2{display:grid;grid-template-columns:30mm 1fr 38mm;gap:7px;margin-bottom:6px}
.por{border-radius:8px;border:1.5px solid var(--yd);height:40mm;background:var(--yl) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b69a3a;font-size:10px}
.mid{display:flex;flex-direction:column;gap:5px}
.attrs{display:flex;gap:3px}
.attr{flex:1;min-width:0;text-align:center;border:1.2px solid var(--yd);border-radius:5px;overflow:hidden;background:#fff;line-height:1.1}
.attr small{display:block;font:500 8.5px/1.5 var(--f);white-space:nowrap;background:var(--yl)}
.ac{color:var(--od);font-weight:700;text-transform:uppercase}
.attr b{display:block;font:700 19px/1.2 var(--f)}.attr i{display:block;font-size:8px;color:var(--g)}
.attr.o{margin-left:6px}.attr.o+.attr.o{margin-left:0}
.idg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px 10px}.s2{grid-column:span 2}.s3{grid-column:span 3}.s6{grid-column:span 6}
.fld{border-bottom:1px solid var(--g);min-height:15px;display:flex;gap:5px;align-items:flex-end}

/* ===================== Fiche : lecture directe du format anarchy-pj v2 ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/’/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
const loose=s=>norm(s).split(' ').map(w=>w.length>3?w.replace(/s$/,''):w).join(' ');
const AT={force:'FOR',agilite:'AGI',volonte:'VOL',logique:'LOG',charisme:'CHA'};
const AL={force:'Force',agilite:'Agilité',volonte:'Volonté',logique:'Logique',charisme:'Charisme'};
const AN={force:['FOR','ce'],agilite:['AGI','lité'],volonte:['VOL','onté'],logique:['LOG','ique'],charisme:['CHA','risme']};
const AC={FOR:'force',AGI:'agilite',VOL:'volonte',LOG:'logique',CHA:'charisme'};
const STL={autopilote:'Autopilote',structure:'Structure',maniabilite:'Maniabilité',vitesse:'Vitesse',blindage:'Blindage',firewall:'Firewall',attaque:'Attaque'};
const VT=['Véhicule','Drone','Cyberdeck'];
const act=x=>x.actif!==false;
const SPEC=new Set(['conjuration','sorcellerie','enchantement','technomancie']);
const strip=s=>norm(String(s||'').replace(/\([^)]*\)/g,''));
const near=(a,b)=>!!a&&!!b&&(a===b||(Math.min(a.length,b.length)>3&&(a.includes(b)||b.includes(a))));
const isEq=t=>['equipement','armure'].includes(norm(t||''));
const vStats=a=>{const v=a.vehicule;if(a.type==='Cyberdeck'&&!a.stats){const q=id=>(a.effets||[]).filter(e=>e.pre===id).reduce((t,e)=>t+(e.qte||1),0);return{firewall:1+q('fw'),attaque:q('att')}}if(!v)return a.stats||null;const pl=vPlus(a),b=v.base||{};
  return{autopilote:6+pl.autopilote,structure:b.structure||0,maniabilite:(b.maniabilite||0)+pl.maniabilite,vitesse:(pl.volant?((b.vitesse||0)*2||(v.micro?1:0)):(b.vitesse||0))+pl.vitesse,blindage:pl.blindage}};
const vLvl=a=>0;
const vPlus=a=>{const q=id=>(a.effets||[]).filter(e=>e.pre===id).reduce((t,e)=>t+(e.qte||1),0);return{autopilote:q('vap'),maniabilite:q('vman'),vitesse:q('vvit'),blindage:q('vbl'),volant:q('vvol')>0}};
const emax=(x,a)=>x.max==='S'?((a.vehicule&&a.vehicule.base&&a.vehicule.base.structure)||0):x.max;
const VSTATIDS=['vap','vman','vvit','vbl','vvol','fw','att'];
const lvl=a=>(a.niveau_base||0)+(a.effets||[]).reduce((t,e)=>t+(e.niveau||0),0)+vLvl(a);
const TC={trait:'#E8710A',"pouvoir d'adepte":'#7C3AED'},TP=['#0F766E','#BE123C','#A16207','#2563EB'];
const tcol=t=>{if(!t)return null;const k=norm(t);return TC[k]||TP[[...k].reduce((a,c)=>a+c.charCodeAt(0),0)%TP.length]};
const RRT=`<table class=rrt><tr><th>RR</th><th class=c1>Faible</th><th class=c2>Normal</th><th class=c3>Fort</th><th class=c4>Extrême</th></tr><tr><td>0</td><td class=c1>1 dé</td><td class=c2>2 dés</td><td class=c3>4 dés</td><td class=c4>6+ dés</td></tr><tr><td>1</td><td class=c1>3 dés</td><td class=c2>5 dés</td><td class=c3>7 dés</td><td class=c4>10+ dés</td></tr><tr><td>2</td><td class=c1>5 dés</td><td class=c2>8 dés</td><td class=c3>11 dés</td><td class=c4>13+ dés</td></tr><tr><td>3</td><td class=c1>8 dés</td><td class=c2>12 dés</td><td class=c3>15 dés</td><td class=c4>N/A</td></tr></table>`;
let PORT=null;

function derive(p){
  const W=[],at=p.attributs||{},av=k=>at[k]||0;
  const evalVD=vd=>{if(vd==null||vd==='')return null;if(typeof vd==='number')return vd;let t=0,ok=false;String(vd).replace(/([+-]?)\s*(FOR|AGI|VOL|LOG|CHA|\d+)/gi,(m,sg,x)=>{const v=/\d/.test(x)?+x:av(AC[x.toUpperCase()]);t+=sg==='-'?-v:v;ok=true;return m});return ok?t:null};
  const armes=(p.armes||[]).filter(act).map(w=>({w,nom:w.nom,cat:w.categorie||'arme',spec:wSpec(w)?loose(wSpec(w)):null,specTxt:wSpec(w),expr:w.toxine?'':w.vd,val:w.toxine?null:evalVD(w.vd),tox:!!w.toxine,ports:w.portees||null,bonus:0,mount:(loose(w.specialisation||'')===loose('armes montées')&&w.monte_sur)||null,seuil:w.seuil,desc:w.description,tsort:w.type_sort||'',aire:!!w.aire,taille:!!w.taille,badge:null}));
  const mn={nom:'Mains nues',cat:'arme',spec:'mains nues',specTxt:'mains nues',expr:'FOR',val:av('force'),ports:['OK','-','-','-'],bonus:0,builtin:true};
  const cands=[mn,...armes.filter(x=>x.cat==='arme'||x.cat==='arme_specialiste')];
  const atoutsAct=(p.atouts||[]).filter(act);
  const rrC={},rrS={},rrSn={},rrA={},bon={phys:0,ment:0,armP:0,cases:{legere:0,grave:0,incap:0}},vds=[],pts=[];
  const RANGS=['Contact','Courte','Moyenne','Longue'],upP=(x,rang,n,src)=>{const k=RANGS.indexOf(rang);if(k<0)return;x.ports=[...(x.ports||['','','',''])];for(let i=0;i<n;i++){const c=wPN([x.ports[k]])[0];if(c==='-')x.ports[k]='Dés';else if(c==='Dés')x.ports[k]='OK';else{W.push(`« ${src} » : la portée ${rang.toLowerCase()} de ${x.nom} est déjà à OK.`);break}}};let ess=6;
  const info=a=>{const t=(a.effets||[]).map(e=>e.texte).filter(Boolean);const e=t.filter(x=>/\bRR\s*\d/i.test(x));return{niv:lvl(a),effet:(e.length?e:t).join(' ; ').slice(0,100)}};
  const eqBadge={},ctBadge={};
  for(const a of atoutsAct){
    ess-=(a.perte_essence||0)+(a.effets||[]).reduce((t,e)=>t+(e.perte_essence||0),0);
    const isV=VT.includes(a.type),eq=!isV&&isEq(a.type),nm=strip(a.nom);
    a._w=eq?cands.find(x=>!x.builtin&&near(strip(x.nom),nm))||null:null;
    a._armOnly=eq&&!a._w;a.lien=null;
    if(a._w){a._w.badge=info(a);a.lien='Armes'}
    else if(eq){const i=(p.equipement||[]).findIndex(e=>act(e)&&near(strip(e.nom),nm));if(i>=0){eqBadge[i]=info(a);a.lien='Équipement'}}
    if(!isV&&norm(a.type||'')==='contact'){const i=(p.contacts||[]).findIndex(c=>act(c)&&near(strip(c.nom),nm));if(i>=0){ctBadge[i]=info(a);a.lien='Contacts'}}
    for(const e of a.effets||[]){const b=e.bonus;if(!b)continue;const n=b.valeur||1;
      if(b.type==='rr'){const c=norm(b.competence||'');if(b.specialisation){const k=c+'|'+loose(b.specialisation);rrS[k]=(rrS[k]||0)+n;rrSn[k]={comp:c,nom:b.specialisation}}else rrC[c]=(rrC[c]||0)+n}
      else if(b.type==='rr_attribut')rrA[b.attribut]=(rrA[b.attribut]||0)+n;
      else if(b.type==='vd'){if(a._w)a._w.bonus+=n;else vds.push({n,cible:b.cible||'',src:e.texte})}
      else if(b.type==='armure'){const m=b.portee==='mental',t=b.portee==='tous';if(!m)bon[a._armOnly?'armP':'phys']+=n;if(m||t)bon.ment+=n}
      else if(b.type==='portee'){if(a._w)upP(a._w,b.rang,n,e.texte);else pts.push({n,cible:b.cible||'',rang:b.rang,src:e.texte})}
      else if(b.type==='case')bon.cases[b.gravite]=(bon.cases[b.gravite]||0)+n;
    }
  }
  for(const d of vds){const tn=strip(d.cible),tl=loose(d.cible);let hit=false;
    for(const x of cands)if(spOk(x.spec,tl)||near(strip(x.nom),tn)){hit=true;if(x.val==null&&!x.tox)W.push(`« ${d.src} » : l’arme ${x.nom} n’a pas de VD de base.`);else x.bonus+=d.n}
    if(!hit)W.push(`« ${d.src} » : bonus de VD non rattaché à une arme.`)}
  for(const d of pts){const tn=strip(d.cible),tl=loose(d.cible);let hit=false;
    for(const x of cands)if(!x.builtin&&(spOk(x.spec,tl)||near(strip(x.nom),tn))||(x.builtin&&x.spec===tl)){hit=true;upP(x,d.rang,d.n,d.src)}
    if(!hit)W.push(`« ${d.src} » : amélioration de portée non rattachée à une arme.`)}
  /* compétences : RR cumulés (compétence + spécialisation + attribut) */
  const used=new Set(),comps=[];
  for(const c of (p.competences||[]).filter(c=>act(c)||(catOf(c.nom)&&!SPEC.has(norm(c.nom))))){
    const cn=norm(c.nom),b=c.indice||0,rc=rrC[cn]||0,ct=catOf(c.nom);
    const row={nom:c.nom,indice:c.indice||null,attribut:c.attribut,rd:b+av(c.attribut),rr:Math.min(3,rc+(rrA[c.attribut]||0)),specs:[],rawC:rc};
    for(const s of (c.specialites||[]).filter(x=>act(x)&&x.nom)){const k=cn+'|'+loose(spFull(s));used.add(k);if(norm(s.nom)==='arme exotique'&&!s.detail)W.push('Spécialisation « arme exotique » : préciser le type d’arme (fouet, tronçonneuse…).');
      row.specs.push({nom:spFull(s),indice:b+2,attribut:s.attribut,rd:b+2+av(s.attribut),rr:Math.min(3,(rrS[k]||0)+rc+(rrA[s.attribut]||0)),raw:rrS[k]||0})}
    for(const k of Object.keys(rrS))if(k.startsWith(cn+'|')&&!used.has(k)){used.add(k);const s=rrSn[k],x=ct&&ct.specs.find(y=>loose(y.nom)===loose(s.nom)),a=x?x.attribut:c.attribut;
      row.specs.push({nom:s.nom,indice:c.indice||null,attribut:a,rd:b+av(a),rr:Math.min(3,rrS[k]+rc+(rrA[a]||0)),raw:rrS[k]})}
    comps.push(row)}
  const have=new Set(comps.map(c=>norm(c.nom)));
  Object.keys(rrC).forEach(k=>{if(!have.has(k))W.push(`RR sur « ${k} » ignoré : la compétence n’est pas sur la fiche.`)});
  Object.keys(rrS).forEach(k=>{if(!used.has(k))W.push(`RR sur « ${rrSn[k].nom} » (${rrSn[k].comp}) ignoré : la compétence n’est pas sur la fiche.`)});
  const vehs=atoutsAct.filter(a=>VT.includes(a.type)).map(a=>({a,kind:a.type,nom:a.nom,type:a.vehicule&&(VMOD.find(y=>y.id===a.vehicule.modele)||{}).nom||'',niveau:lvl(a),st:vStats(a),prog:a.programmes||[],notes:(a.effets||[]).filter(e=>!e.stat&&!VSTATIDS.includes(e.pre)).map(e=>e.texte).filter(Boolean),mounts:armes.filter(x=>x.mount&&norm(x.mount)===norm(a.nom))}));
  armes.forEach(x=>{if(x.mount&&!vehs.some(v=>norm(v.nom)===norm(x.mount)))W.push(`Arme « ${x.nom} » : monture « ${x.mount} » introuvable.`)});
  const lim={comp:Math.max(0,...Object.values(rrC)),spec:Math.max(0,...Object.values(rrS))};
  return{W,ess,comps,bon,mn,armes,vehs,eqBadge,ctBadge,lim,rrA,
    atouts:atoutsAct.filter(a=>!VT.includes(a.type)),
    main:armes.filter(x=>x.cat==='arme'||x.cat==='arme_specialiste'),
    sorts:armes.filter(x=>x.cat==='sort'),formes:armes.filter(x=>x.cat==='forme_complexe')};
}

function render(p){
  const D=derive(p),at=p.attributs||{},I=p.identite||{},C=costs(p),mx=maxOf(p),av=k=>at[k]||0;
  const dots=n=>'●'.repeat(Math.min(3,n||0));
  const sec=(t,b,c)=>b?`<section${c?' class='+c:''}><h2>${t}</h2>${b}</section>`:'';
  const li=(a,c)=>a.length?`<ul${c?' class='+c:''}>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  const badge=x=>x?`<span class=tag2>atout niv. ${x.niv}</span> <span class=m>${esc(x.effet)}</span>`:'';
  const lst=(a,c)=>a.length?`<ul${c?' class='+c:''}>${a.map(x=>`<li>${esc(x.nom)}${badge(x.badge)}</li>`).join('')}</ul>`:'';
  const row=(n,i,a,rd,r,s)=>`<tr class=${s?'s':'b'}><td>${s?'<span class=ar>↳</span>':''}${esc(n)}</td><td class=ix>${i??''}</td><td>${AT[a]||''}</td><td class=rd><b>${rd}</b></td><td class=rr>${dots(r)}</td></tr>`;
  const cblk=D.comps.map(c=>({n:1+c.specs.length,h:'<tbody class=g>'+row(c.nom,c.indice,c.attribut,c.rd,c.rr)+c.specs.map(s=>row(s.nom,s.indice,s.attribut,s.rd,s.rr,1)).join('')+'</tbody>'}));
  const ctot=cblk.reduce((t,x)=>t+x.n,0);let cacc=0,csp=0;cblk.forEach((x,i)=>{if(cacc+x.n/2<=ctot/2)csp=i+1;cacc+=x.n});
  const ctab=l=>`<table class=ct><colgroup><col><col style="width:7mm"><col style="width:8mm"><col style="width:9mm"><col style="width:7mm"></colgroup><thead><tr><th>Compétence</th><th>Ind.</th><th>Att.</th><th>RD</th><th>RR</th></tr></thead>${l.map(x=>x.h).join('')}</table>`;
  const comps=`<div class=cmp2>${ctab(cblk.slice(0,csp))}${csp<cblk.length?ctab(cblk.slice(csp)):''}</div>`;
  const atouts=D.atouts.map(a=>{const c=tcol(a.type),fx=(a.effets||[]).map(e=>e.texte).filter(Boolean);
    return `<div class=at${c?` style="border-left-color:${c}"`:''}><span class=lv>niv. ${lvl(a)}</span>${a.type?`<em style="color:${c};background:${c}1f">${esc(a.type)}</em> `:''}<b>${esc(a.nom)}</b>${fx.map(t=>`<div class=ln>${esc(t)}</div>`).join('')}</div>`}).join('');
  /* armes */
  const vdSub=x=>{const s=[];if(typeof x.expr==='string'&&/[A-Z]/.test(x.expr))s.push(x.expr);if(x.bonus)s.push('+atout');return s.length?`<div class=m>${esc(s.join(' '))}</div>`:''};
  const pc=v=>{const t=(v||'').trim();return `<td class="pc${t==='OK'?' ok':t==='Dés'?' de':''}">${t==='-'?'–':esc(t)}</td>`};

const AVAIL=(297-16-9)*96/25.4;
function zoomOf(el,min){
  el.style.zoom='';
  const box=document.createElement('div');box.style.cssText='position:absolute;left:-99999px;top:0;width:192mm;visibility:hidden';
  const cl=el.cloneNode(true);cl.classList.add('meas');box.appendChild(cl);document.body.appendChild(box);
  const hh=()=>cl.getBoundingClientRect().height;let z=1,h=hh();
  while(h>AVAIL&&z>min){z=Math.max(min,z*Math.min(.98,AVAIL/h));cl.style.zoom=z;h=hh()}
  document.body.removeChild(box);return z}
function fitPages(){

    p1.appendChild(b);

}

function closePJ(i){
  stash();
  if(SESS[i].dirty&&!confirm('Fermer « '+pseudoDe(i)+' » sans enregistrer les modifications ?'))return;
  Promise.resolve().then(()=>HSTORE.del(SESS[i].id)).catch(()=>{});
  SESS.splice(i,1);
  if(!SESS.length){CUR=-1;addPJ({});return}
  if(i<CUR)CUR--;
  else if(i===CUR){CUR=-1;activate(Math.min(i,SESS.length-1),true)}
  chips();persist();
}
function setPJ(p){PJ=normalize(p);FH=null;DIRTY=false;$('#dirty').textContent='';rebuild();if(!$('#fiche').hidden)showTab('fiche')}
function openText(t,fh,quiet){
  try{const p=JSON.parse(t);
    if(p.format==='anarchy-fiche-gsheet')throw Error('Ancien format de la feuille Google, qui n’est plus pris en charge.');
    if(p.format!=='anarchy-pj')throw Error('Format inconnu (attendu : anarchy-pj).');
    migrate(p);addPJ(p,fh);$('#msg').textContent='';
    return true
  }catch(e){if(!quiet)$('#msg').textContent='Erreur : '+e.message;return false}
}
/* Fichier : sur les navigateurs qui le permettent (Chrome, Edge), « Enregistrer » réécrit le fichier ouvert ;
   ailleurs, l'enregistrement se fait par téléchargement. */
const FSA=typeof showOpenFilePicker==='function'&&typeof showSaveFilePicker==='function',JSONTYPES=[{description:'Personnage Anarchy (JSON)',accept:{'application/json':['.json']}}];
const flash=t=>{$('#msg').textContent=t;setTimeout(()=>{if($('#msg').textContent===t)$('#msg').textContent=''},4000)};
const nomFichier=()=>(PJ.identite.pseudo||'pj').replace(/[^\w\-]+/g,'_')+'.json';
function clean(){DIRTY=false;$('#dirty').textContent='';chips();persist()}
function download(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([SER(PJ,2)],{type:'application/json'}));
  a.download=nomFichier();a.click();clean();
}
const memeFichier=async(a,b)=>{try{return await a.isSameEntry(b)}catch(e){return false}};
async function ouvrirHandles(hs,quiet){
  let n=0;
  for(const h of hs){
    stash();let k=-1;
    for(let j=0;j<SESS.length;j++){if(SESS[j].fh&&await memeFichier(SESS[j].fh,h)){k=j;break}}
    if(k>=0){activate(k);continue}
    if(openText(await(await h.getFile()).text(),h,quiet))n++
  }
  return n
}
async function openFile(){
  try{await ouvrirHandles(await showOpenFilePicker({types:JSONTYPES,multiple:true}))}
  catch(e){if(e.name!=='AbortError')$('#msg').textContent='Erreur : '+e.message}
}
const bilanDossier=(n,nom)=>flash(n?n+' personnage(s) ouvert(s) depuis « '+nom+' »':'Aucun personnage Anarchy dans « '+nom+' »');
async function ouvrirDossier(){
  if(typeof showDirectoryPicker!=='function'){$('#fdir').click();return}
  try{
    const d=await showDirectoryPicker({mode:'readwrite'}),hs=[];
    for await(const [nom,h] of d.entries())if(h.kind==='file'&&/\.json$/i.test(nom))hs.push(h);
    hs.sort((x,y)=>x.name.localeCompare(y.name));
    bilanDossier(await ouvrirHandles(hs,true),d.name)
  }catch(e){if(e.name!=='AbortError')$('#msg').textContent='Erreur : '+e.message}
}
const acces=async h=>{try{if(!h.queryPermission)return true;let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});return p==='granted'}catch(e){return false}};
async function save(as){
  if(FSA){
    try{
      if(!as&&FH&&!(await acces(FH)))FH=null;
      if(as||!FH)FH=await showSaveFilePicker({suggestedName:nomFichier(),types:JSONTYPES});
      const w=await FH.createWritable();await w.write(SER(PJ,2));await w.close();
      clean();flash('Enregistré : '+FH.name);return
    }catch(e){if(e.name==='AbortError')return;FH=null;flash('Écriture impossible, fichier téléchargé à la place.')}
  }
  download()
}
async function saveAll(){
  stash();const cur=CUR;let ok=0;const ko=[];
  for(let i=0;i<SESS.length;i++){
    if(!SESS[i].dirty)continue;
    activate(i);await save(false);
    if(DIRTY)ko.push(pseudoDe(i));else ok++
  }
  activate(cur);
  flash(ok||ko.length?`${ok} enregistré(s)`+(ko.length?' ; non enregistré(s) : '+ko.join(', '):''):'Rien à enregistrer')
}
/* Onglet Comparer : tableau de synthèse, une colonne par personnage ouvert. */
function renderComp(){
  const el=$('#comp');stash();
  const old=el.querySelector('.cw'),sl=old?old.scrollLeft:0;
  if(SESS.length<2){el.innerHTML='<div class="cw ce">Ouvrez au moins deux personnages pour les comparer : <b>Ouvrir</b> accepte plusieurs fichiers à la fois, et <b>Nouveau</b> ajoute un personnage.</div>';return}
  const barre=`<div class="csel"><b>Comparer :</b> ${SESS.map((s,i)=>`<label><input type="checkbox" data-c="${i}"${s.cmp!==false?' checked':''}> ${esc(pseudoDe(i))}</label>`).join('')}</div>`;
  const lab=etiquettes(),idx=SESS.map((s,i)=>i).filter(i=>SESS[i].cmp!==false);
  if(idx.length<2){el.innerHTML=barre+'<div class="cw ce">Coche au moins deux personnages pour les comparer.</div>';return}
  const cols=idx.map(i=>({p:SESS[i].pj,lab:lab[i],fh:SESS[i].fh,D:derive(SESS[i].pj),C:costs(SESS[i].pj)})),n=cols.length;
  const sec=t=>`<tr class="sec"><th colspan="${n+1}">${t}</th></tr>`;
  /* La meilleure valeur d'une ligne numérique (vals[].n) est surlignée quand les valeurs diffèrent. */
  const row=(lab,vals)=>{
    const ns=vals.map(v=>v.n).filter(x=>typeof x==='number'),mx=Math.max(...ns),dif=ns.length>1&&new Set(ns).size>1;
    return `<tr><th>${lab}</th>${vals.map(v=>`<td class="${dif&&v.n===mx?'mx':''}${v.h===''||v.h==='–'?' n':''}">${v.h||'–'}</td>`).join('')}</tr>`};
  const sc=(f,fmtv,num)=>cols.map(c=>{const v=f(c);return{n:num?v:undefined,h:fmtv?fmtv(v):esc(v)}});
  let h=`<table class="cmp"><thead><tr><th></th>${cols.map(c=>`<th>${esc(c.lab)}<small>${esc(c.p.identite.metatype||'')}${c.fh?' · '+esc(c.fh.name):''}</small></th>`).join('')}</tr></thead><tbody>`;
  h+=sec('Ressources');
  h+=row('Essence',sc(c=>c.D.ess,null,true));
  h+=row('Nuyens dépensés',sc(c=>c.C.total,fmt));
  h+=row('Nuyens restants',sc(c=>c.C.reste,fmt));
  h+=row('Niveau de jeu',sc(c=>c.p.niveau_de_jeu.nom||''));
  h+=sec('Attributs');
  KEYS.forEach(k=>{h+=row(KL[k],sc(c=>c.p.attributs[k]||0,null,true))});
  h+=sec('Compétences');
  const noms=[],vu=new Set();
  cols.forEach(c=>c.D.comps.forEach(r=>{if((r.indice||r.rr)&&!vu.has(norm(r.nom))){vu.add(norm(r.nom));noms.push(r.nom)}}));
  noms.forEach(nm=>{
    h+=row(esc(nm),cols.map(c=>{
      const r=c.D.comps.find(x=>norm(x.nom)===norm(nm));
      if(!r||!(r.indice||r.rr))return{h:''};
      const sp=r.specs.map(x=>`<small>↳ ${esc(x.nom)} : RD ${x.rd}${x.rr?' · RR'+x.rr:''}</small>`).join('');
      return{n:r.indice||0,h:`<b>${r.indice||0}</b> <small style="display:inline">RD ${r.rd}${r.rr?' · RR'+r.rr:''}</small>${sp}`}
    }));
  });
  const liste=(lab,f)=>{
    const ls=cols.map(c=>f(c));if(!ls.some(l=>l.length))return;
    h+=row(lab,ls.map(l=>({h:l.map(x=>`<span class="l">${x}</span>`).join('')})));
  };
  h+=sec('Atouts et véhicules');
  liste('Atouts',c=>c.D.atouts.map(a=>`${esc(a.nom||'?')} <i>${esc(a.type||'')} · niv. ${lvl(a)}</i>`));
  liste('Véhicules et drones',c=>c.D.vehs.map(v=>`${esc(v.nom||'?')} <i>${esc(v.kind)} · niv. ${v.niveau}</i>`));
  h+=sec('Armes et magie');
  liste('Armes',c=>c.D.main.map(x=>`${esc(x.nom||'?')} <i>VD ${x.tox?'toxine':esc(x.val??x.expr??'')}</i>`));
  liste('Sorts',c=>c.D.sorts.map(x=>esc(x.nom||'?')));
  liste('Formes complexes',c=>c.D.formes.map(x=>esc(x.nom||'?')));
  el.innerHTML=barre+'<div class="cw">'+h+'</tbody></table></div>';
  const nw=el.querySelector('.cw');if(nw)nw.scrollLeft=sl;
}
/* Impression de toutes les fiches : chaque fiche est mise en page puis recopiée dans #out. */
function prepAll(){
  stash();const parts=[];
  SESS.forEach(s=>{render(s.pj);fitPages();parts.push($('#out').innerHTML)});
  $('#out').innerHTML=parts.join('');MULTI=true;
}
function printAll(){prepAll();print()}
addEventListener('afterprint',()=>{if(MULTI){MULTI=false;render(PJ);fitPages()}});
$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
addEventListener('beforeprint',()=>{if(!MULTI)fitPages()});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$('#fiche').hidden)fitPages()});
$('#mini').onclick=()=>$('#panel').scrollIntoView({behavior:'smooth'});
$('#bsave').onclick=()=>save(false);$('#bsaveall').onclick=saveAll;$('#bdir').onclick=ouvrirDossier;
$('#fdir').onchange=async e=>{const fs=[...e.target.files].filter(f=>/\.json$/i.test(f.name)&&(f.webkitRelativePath||'').split('/').length<=2).sort((x,y)=>x.name.localeCompare(y.name));e.target.value='';let n=0;for(const f of fs)if(openText(await f.text(),null,true))n++;bilanDossier(n,'ce dossier')};if(FSA){$('#bsaveas').hidden=false;$('#bsaveas').onclick=()=>save(true);$('#fopen').parentElement.onclick=e=>{e.preventDefault();openFile()}}$('#bprint').onclick=()=>print();$('#bprintall').onclick=printAll;
$('#comp').onchange=e=>{const i=e.target.dataset&&e.target.dataset.c;if(i==null)return;SESS[+i].cmp=e.target.checked;persist();renderComp()};
$('#pjs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!=null)activate(+b.dataset.go);else if(b.dataset.x!=null)closePJ(+b.dataset.x)};
$('#bnew').onclick=()=>{if(SESS[CUR]&&SESS[CUR].neuf&&!DIRTY){flash('Le personnage courant est déjà vide.');return}addPJ({});showTab('crea')};
$('#fopen').onchange=async e=>{const fs=[...e.target.files];e.target.value='';for(const f of fs)openText(await f.text())};
addEventListener('beforeunload',e=>{stash();if(SESS.some(x=>x.dirty)){e.preventDefault();e.returnValue=''}});
{
  let rest=null;try{rest=JSON.parse(localStorage.getItem('anarchy-pjs')||'null')}catch(e){}
  if(!rest){try{const o=JSON.parse(localStorage.getItem('anarchy-pj')||'null');if(o)rest={cur:0,list:[{pj:o}]}}catch(e){}}
  ((rest&&Array.isArray(rest.list))?rest.list:[]).forEach(e=>{try{if(e&&e.pj&&e.pj.format==='anarchy-pj'){migrate(e.pj);addPJ(e.pj,null,e.dirty,e.id);if(e.cmp===false)SESS[SESS.length-1].cmp=false}}catch(x){}});
  if(!SESS.length)addPJ({});else if(rest.cur>0&&rest.cur<SESS.length)activate(rest.cur);
  restoreHandles()
}

</script></body></html>
