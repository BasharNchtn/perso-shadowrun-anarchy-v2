const vLvl=a=>a.vehicule?(a.vehicule.volant?1:0)+Object.values(a.vehicule.plus||{}).reduce((t,x)=>t+(x||0),0):0;

const TC={trait:'#E8710A',"pouvoir d'adepte":'#7C3AED'},TP=['#0F766E','#BE123C','#A16207','#2563EB'];
const tcol=t=>{if(!t)return null;const k=norm(t);return TC[k]||TP[[...k].reduce((a,c)=>a+c.charCodeAt(0),0)%TP.length]};
const RRT=`<table class=rrt><tr><th>RR</th><th class=c1>Faible</th><th class=c2>Normal</th><th class=c3>Fort</th><th class=c4>Extrême</th></tr><tr><td>0</td><td class=c1>1 dé</td><td class=c2>2 dés</td><td class=c3>4 dés</td><td class=c4>6+ dés</td></tr><tr><td>1</td><td class=c1>3 dés</td><td class=c2>5 dés</td><td class=c3>7 dés</td><td class=c4>10+ dés</td></tr><tr><td>2</td><td class=c1>5 dés</td><td class=c2>8 dés</td><td class=c3>11 dés</td><td class=c4>13+ dés</td></tr><tr><td>3</td><td class=c1>8 dés</td><td class=c2>12 dés</td><td class=c3>15 dés</td><td class=c4>N/A</td></tr></table>`;
let PORT=null;

function derive(p){
  const W=[],at=p.attributs||{},ar=p.armure||{},av=k=>at[k]||0;
  const evalVD=vd=>{if(vd==null||vd==='')return null;if(typeof vd==='number')return vd;let t=0,ok=false;String(vd).replace(/([+-]?)\s*(FOR|AGI|VOL|LOG|CHA|\d+)/gi,(m,sg,x)=>{const v=/\d/.test(x)?+x:av(AC[x.toUpperCase()]);t+=sg==='-'?-v:v;ok=true;return m});return ok?t:null};
  const armes=(p.armes||[]).filter(act).map(w=>({w,nom:w.nom,cat:w.categorie||'arme',spec:w.specialisation?loose(w.specialisation):null,specTxt:w.specialisation||'',expr:w.vd,val:evalVD(w.vd),ports:w.portees||null,bonus:0,mount:w.monte_sur||null,seuil:w.seuil,desc:w.description,badge:null}));
  const mn={nom:'Mains nues',cat:'arme',spec:'mains nues',specTxt:'mains nues',expr:'FOR',val:av('force'),ports:['OK','-','-','-'],bonus:0,builtin:true};
  const cands=[mn,...armes.filter(x=>x.cat==='arme'||x.cat==='arme_specialiste')];
  const atoutsAct=(p.atouts||[]).filter(act);
  const rrC={},rrS={},rrSn={},rrA={},bon={phys:0,ment:0,armP:0,cases:{legere:0,grave:0,incap:0}},vds=[];let ess=6;
  const info=a=>{const t=(a.effets||[]).map(e=>e.texte).filter(Boolean);const e=t.filter(x=>/\bRR\s*\d/i.test(x));return{niv:lvl(a),effet:(e.length?e:t).join(' ; ').slice(0,100)}};
  const eqBadge={},ctBadge={};
  for(const a of atoutsAct){
    ess-=(a.perte_essence||0)+(a.effets||[]).reduce((t,e)=>t+(e.perte_essence||0),0);
    const isV=VT.includes(a.type),eq=!isV&&isEq(a.type),nm=strip(a.nom);
    a._w=eq?cands.find(x=>!x.builtin&&near(strip(x.nom),nm))||null:null;
    a._armOnly=eq&&!a._w;a.lien=null;
    if(a._w){a._w.badge=info(a);a.lien='Armes'}
    else if(eq){const i=(p.equipement||[]).findIndex(e=>act(e)&&near(strip(e.nom),nm));if(i>=0){eqBadge[i]=info(a);a.lien='Équipement'}}
    if(!isV&&norm(a.type||'')==='contact'){const i=(p.contacts||[]).findIndex(c=>act(c)&&near(strip(c.nom),nm));if(i>=0){ctBadge[i]=info(a);a.lien='Contacts'}}
    for(const e of a.effets||[]){const b=e.bonus;if(!b)continue;const n=b.valeur||1;
      if(b.type==='rr'){const c=norm(b.competence||'');if(b.specialisation){const k=c+'|'+loose(b.specialisation);rrS[k]=(rrS[k]||0)+n;rrSn[k]={comp:c,nom:b.specialisation}}else rrC[c]=(rrC[c]||0)+n}
      else if(b.type==='rr_attribut')rrA[b.attribut]=(rrA[b.attribut]||0)+n;
      else if(b.type==='vd'){if(a._w)a._w.bonus+=n;else vds.push({n,cible:b.cible||'',src:e.texte})}
      else if(b.type==='armure'){const m=b.portee==='mental',t=b.portee==='tous';if(!m)bon[a._armOnly?'armP':'phys']+=n;if(m||t)bon.ment+=n}
      else if(b.type==='case')bon.cases[b.gravite]=(bon.cases[b.gravite]||0)+n;
    }
  }
  for(const d of vds){const tn=strip(d.cible),tl=loose(d.cible);let hit=false;
    for(const x of cands)if((x.spec&&x.spec===tl)||near(strip(x.nom),tn)){hit=true;if(x.val==null)W.push(`« ${d.src} » : l’arme ${x.nom} n’a pas de VD de base.`);else x.bonus+=d.n}
    if(!hit)W.push(`« ${d.src} » : bonus de VD non rattaché à une arme.`)}
  /* compétences : RR cumulés (compétence + spécialisation + attribut) */
  const used=new Set(),comps=[];
  for(const c of (p.competences||[]).filter(act)){
    const cn=norm(c.nom),b=c.indice||0,rc=rrC[cn]||0,ct=catOf(c.nom);
    const row={nom:c.nom,indice:c.indice||null,attribut:c.attribut,rd:b+av(c.attribut),rr:Math.min(3,rc+(rrA[c.attribut]||0)),specs:[],rawC:rc};
    for(const s of (c.specialites||[]).filter(x=>act(x)&&x.nom)){const k=cn+'|'+loose(s.nom);used.add(k);
      row.specs.push({nom:s.nom,indice:b+2,attribut:s.attribut,rd:b+2+av(s.attribut),rr:Math.min(3,(rrS[k]||0)+rc+(rrA[s.attribut]||0)),raw:rrS[k]||0})}
    for(const k of Object.keys(rrS))if(k.startsWith(cn+'|')&&!used.has(k)){used.add(k);const s=rrSn[k],x=ct&&ct.specs.find(y=>loose(y.nom)===loose(s.nom)),a=x?x.attribut:c.attribut;
      row.specs.push({nom:s.nom,indice:c.indice||null,attribut:a,rd:b+av(a),rr:Math.min(3,rrS[k]+rc+(rrA[a]||0)),raw:rrS[k]})}
    comps.push(row)}
  const have=new Set(comps.map(c=>norm(c.nom)));
  Object.keys(rrC).forEach(k=>{if(!have.has(k))W.push(`RR sur « ${k} » ignoré : la compétence n’est pas sur la fiche.`)});
  Object.keys(rrS).forEach(k=>{if(!used.has(k))W.push(`RR sur « ${rrSn[k].nom} » (${rrSn[k].comp}) ignoré : la compétence n’est pas sur la fiche.`)});
  const vehs=atoutsAct.filter(a=>VT.includes(a.type)).map(a=>({a,kind:a.type,nom:a.nom,niveau:lvl(a),st:vStats(a),prog:a.programmes||[],notes:(a.effets||[]).filter(e=>!e.stat).map(e=>e.texte).filter(Boolean),mounts:armes.filter(x=>x.mount&&norm(x.mount)===norm(a.nom))}));
  armes.forEach(x=>{if(x.mount&&!vehs.some(v=>norm(v.nom)===norm(x.mount)))W.push(`Arme « ${x.nom} » : monture « ${x.mount} » introuvable.`)});
  const lim={comp:Math.max(0,...Object.values(rrC)),spec:Math.max(0,...Object.values(rrS))};
  return{W,ess,comps,bon,mn,armes,vehs,eqBadge,ctBadge,lim,rrA,
    atouts:atoutsAct.filter(a=>!VT.includes(a.type)),
    main:armes.filter(x=>(x.cat==='arme'||x.cat==='arme_specialiste')&&!x.mount),
    sorts:armes.filter(x=>x.cat==='sort'),formes:armes.filter(x=>x.cat==='forme_complexe')};
}

  const spl=a=>a.length?`<table class=wt><colgroup><col style="width:34%"><col style="width:13mm"><col></colgroup><thead><tr><th>Nom</th><th>Seuil</th><th>Description</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.nom)}</b>${badge(x.badge)}</td><td class=vd><b>${esc(x.seuil??'')}</b></td><td style="text-align:left">${esc(x.desc||'')}</td></tr>`).join('')}</tbody></table>`:'';

  const vwr=x=>`<div class=m><b>${esc(x.nom)}</b>${x.specTxt?` <i>(${esc(x.specTxt)})</i>`:''}${x.val!=null?` · VD ${x.val+x.bonus}`:''}${x.ports?' · '+esc(x.ports.map(t=>t==='-'?'–':t).join(' / ')):''}</div>`;
  const vc=v=>{const s=v.st||{},isD=v.kind==='Cyberdeck';let dm='';

function bonusText(b){
  if(b.type==='rr')return `RR${b.valeur||1} sur ${b.competence||'?'}${b.specialisation?` (${b.specialisation})`:''}`;
  if(b.type==='rr_attribut')return `RR${b.valeur||1} sur ${KL[b.attribut]||'?'}`;
  if(b.type==='vd')return `VD +${b.valeur||1} sur ${b.cible||'?'}`;
  if(b.type==='armure')return b.portee==='mental'?`Armure mentale +${b.valeur||1}`:b.portee==='tous'?`Armure +${b.valeur||1} contre tous dommages`:`Armure +${b.valeur||1}`;
  if(b.type==='case'){const g=GRAV.find(x=>x[0]===b.gravite)||GRAV[0];return `Case de blessure ${g[1]} supplémentaire`+((b.valeur||1)>1?` +${b.valeur}`:'')}
  return '';
}
function autoCost(b){const v=b.valeur||1;
  if(b.type==='rr')return (b.specialisation||b.perso_spec?2:5)*v;
  if(b.type==='rr_attribut')return 10*v;
  if(b.type==='case')return (GRAV.find(x=>x[0]===b.gravite)||GRAV[0])[2]*v;
  return v}
function syncEf(e){if(e.bonus){e.texte=bonusText(e.bonus);if(e.auto)e.niveau=autoCost(e.bonus)}}

function normalize(p){
  p=p||{};p.format='anarchy-pj';p.version=2;
  p.identite=Object.assign({pseudo:'',nom:'',metatype:'Humain',mots_cles:[],train_de_vie:'Train de vie bas',naissance:'',taille:'',poids:'',particularites:'',repliques:[],comportements:[]},p.identite);
  {const o=p.identite,old=[o.statut_social,o.origine,o.role,o.autre_mot_cle].filter(Boolean);if(!(o.mots_cles&&o.mots_cles.length)&&old.length)o.mots_cles=old;['statut_social','origine','role','autre_mot_cle'].forEach(k=>delete o[k])}
  p.niveau_de_jeu=Object.assign({nom:'Choix',nuyens:400000,nb_attributs_max:1,indice_max_competence:5,rr_max_competence:2,rr_max_specialisation:2},p.niveau_de_jeu);
  p.gains=p.gains||0;
  p.attributs=Object.assign({force:1,agilite:1,volonte:1,logique:1,charisme:1},p.attributs);
  p.attributs_max=p.attributs_max||null;
  const have=p.competences||[],out=[];
  CATALOGUE.forEach(c=>out.push(have.find(x=>norm(x.nom)===norm(c.nom))||{nom:c.nom,actif:false,attribut:c.attribut,indice:0,specialites:[]}));
  have.forEach(x=>{if(!out.includes(x))out.push(x)});
  out.forEach(c=>{c.specialites=c.specialites||[];c.indice=c.indice||0;if(c.actif===undefined)c.actif=true;c.specialites.forEach(s=>{if(s.actif===undefined)s.actif=true})});
  p.competences=out;
  p.contacts=p.contacts||[];p.connaissances=p.connaissances||[];p.atouts=p.atouts||[];
  p.atouts.forEach(a=>{if(a.vehicule){a.vehicule.base=Object.assign({structure:4,maniabilite:4,vitesse:4},a.vehicule.base);a.vehicule.plus=Object.assign({autopilote:0,structure:0,maniabilite:0,vitesse:0,blindage:0},a.vehicule.plus)}});p.armes=p.armes||[];
  p.equipement=p.equipement||[{nom:'Faux SIN',actif:true,offert:true},{nom:'Commlink',actif:true,offert:true}];
  p.armure=Object.assign({nom:'',valeur:0,actif:true},p.armure);
  return p;
}
const maxOf=p=>{const m=p.attributs_max||META[p.identite.metatype];return KEYS.map((k,i)=>m?(Array.isArray(m)?m[i]:m[k]):null)};
const cc=i=>i<6?i*2500:12500+(i-5)*5000;
const on=x=>x.actif!==false;

function costs(p){
  const mx=maxOf(p),at=p.attributs,C={};
  C.attCost=KEYS.map((k,i)=>{const v=at[k]||0;return mx[i]!=null&&v>=mx[i]?20000+(v-1)*10000:v*10000});
  C.nMax=KEYS.filter((k,i)=>mx[i]!=null&&(at[k]||0)>=mx[i]).length;
  C.comp=p.competences.map(c=>{const o=on(c),b=c.indice||0;return{cost:o?cc(b):0,rd:b+(at[c.attribut]||0),specs:c.specialites.map(s=>({cost:o&&on(s)?2500:0,rd:b+2+(at[s.attribut]||0)}))}});
  C.atouts=p.atouts.map(a=>({niv:lvl(a),cost:on(a)?5000*lvl(a):0}));
  C.armes=p.armes.map(w=>on(w)?(w.categorie==='arme_specialiste'||w.categorie==='sort'||w.categorie==='forme_complexe'?5000:2500):0);
  C.equip=p.equipement.map(e=>e.offert?null:on(e)?2500:0);
  C.armureCost=on(p.armure)?2500*(p.armure.valeur||0):0;
  const sum=a=>a.reduce((t,x)=>t+(x||0),0);
  C.att=sum(C.attCost);C.compT=sum(C.comp.map(c=>c.cost));C.spec=sum(C.comp.map(c=>sum(c.specs.map(s=>s.cost))));
  C.conn=2500*p.connaissances.filter(c=>on(c)&&c.nom).length;C.at=sum(C.atouts.map(a=>a.cost));
  C.arm=sum(p.armes.map((w,i)=>w.categorie==='sort'||w.categorie==='forme_complexe'?0:C.armes[i]));
  C.sorts=sum(p.armes.map((w,i)=>w.categorie==='sort'||w.categorie==='forme_complexe'?C.armes[i]:0));
  C.eq=sum(C.equip);
  C.total=C.att+C.compT+C.spec+C.conn+C.at+C.arm+C.sorts+C.armureCost+C.eq;
  C.dispo=(p.niveau_de_jeu.nuyens||0)+(p.gains||0);C.reste=C.dispo-C.total;
  return C;
}

  const wRow=(w,i)=>{const cat=w.categorie||'arme',arm=cat==='arme'||cat==='arme_specialiste',po=w.portees||['','','',''];
    return `<div class=cb data-row="armes.${i}"><div class=row>${Ck(`armes.${i}.actif`)}<input class=nm data-p="armes.${i}.nom" type=text placeholder="Nom" value="${esc(w.nom)}"><select class=ty data-act=wcat data-i=${i}>${opt(Object.entries(CATEG),cat)}</select><span class=cv data-v="arme.${i}"></span><button class=btn data-act=delarme data-i=${i}>✕</button></div>
${arm?`<div class="row sp ef"><span class=mini>VD</span><input data-p="armes.${i}.vd" type=text placeholder="7 ou FOR+2" value="${esc(w.vd??'')}" style="width:84px;flex:none"><span class=mini>spécialisation</span><input data-p="armes.${i}.specialisation" list=spes type=text placeholder="mains nues, lames…" value="${esc(w.specialisation||'')}" style="width:140px;flex:none"><span class=mini>monté sur</span><select class=ty data-p="armes.${i}.monte_sur">${opt([['','—'],...hosts.map(h=>[h,h])],w.monte_sur||'')}</select></div>
<div class="row sp ef"><span class=mini>Portées</span>${['Contact','Courte','Moyenne','Longue'].map((l,k)=>`<span class=mini>${l}</span><select class=sa data-act=port data-i=${i} data-k=${k}>${opt([['','·'],['OK','OK'],['Dés','Dés'],['-','–']],po[k]||'')}</select>`).join('')}</div>`
:`<div class="row sp ef"><span class=mini>Seuil</span><input data-p="armes.${i}.seuil" type=text style="width:70px;flex:none" value="${esc(w.seuil??'')}"><span class=mini>Description</span><input class=n data-p="armes.${i}.description" type=text value="${esc(w.description||'')}"></div>`}</div>`};
  const armes=`<section><h2>Armes, sorts, formes complexes <small class=pr>2 500 ¥ · spécialiste, sort, forme complexe 5 000 ¥</small></h2><div class=hint>« Mains nues » est ajoutée automatiquement (VD = Force). VD : un nombre ou une expression avec attributs (FOR+2). Portées : Contact, Courte, Moyenne, Longue.</div><datalist id=spes>${spes.map(x=>`<option>${esc(x)}`).join('')}</datalist>${p.armes.map(wRow).join('')}<button class=btn data-act=addarme>+ arme, sort ou forme complexe</button></section>`;
  const eRow=(e,i)=>`<div class=row data-row="equipement.${i}">${Ck(`equipement.${i}.actif`)}<input class=nm data-p="equipement.${i}.nom" type=text placeholder="Équipement" value="${esc(e.nom)}"><label class=mini><input data-p="equipement.${i}.offert" type=checkbox${e.offert?' checked':''}> offert</label><span class=cv data-v="equip.${i}"></span><button class=btn data-act=delequip data-i=${i}>✕</button></div>`;
  const eq=`<section><h2>Armure et équipement <small class=pr>armure 2 500 ¥ par point · équipement 2 500 ¥ par ligne (hors offert)</small></h2><div class=row data-row="armure">${Ck('armure.actif')}<input class=nm data-p="armure.nom" type=text placeholder="Armure portée" value="${esc(p.armure.nom)}"><span class=mini>points</span>${Nu('armure.valeur',0,20)}<span class=cv data-v=armure></span></div>${p.equipement.map(eRow).join('')}<button class=btn data-act=addequip style="margin-top:4px">+ équipement</button></section>`;
  $('#form').innerHTML=ident+niv+att+competences+conn+ctc+atouts+armes+eq;
}

function vv(k,C){try{return vv_(k,C)}catch(e){return ''}}
function vv_(k,C){const[t,a,b]=k.split('.');
  if(t==='att')return fmt(C.attCost[KEYS.indexOf(a)]);
  if(t==='comp')return b==='cost'?fmt(C.comp[a].cost):'RD '+C.comp[a].rd;
  if(t==='spec'){const w=k.split('.')[3],s=C.comp[a].specs[b];return w==='cost'?fmt(s.cost):'RD '+s.rd}
  if(t==='atout')return b==='niv'?'niv. '+C.atouts[a].niv:fmt(C.atouts[a].cost);
  if(t==='arme')return fmt(C.armes[a]);
  if(t==='equip')return C.equip[a]===null?'offert':fmt(C.equip[a]);
  if(t==='armure')return fmt(C.armureCost);
  if(t==='dispo')return fmt(C.dispo);
  if(t==='veh'){const at=PJ.atouts[a],s=vStats(at),v=at.vehicule,sum=(v.base.structure||0)+(v.base.maniabilite||0)+(v.base.vitesse||0),tg=v.micro?10:12;return 'Indices finaux : '+Object.entries(s).map(([k,x])=>STL[k]+' '+x).join(' · ')+' — répartition de base '+sum+' / '+tg+(sum===tg?' ✔':' ✖')+' — 1 monture d’arme incluse — niveaux : base '+(at.niveau_base||0)+' + volant '+(v.volant?1:0)+' + améliorations '+Object.values(v.plus||{}).reduce((t,x)=>t+(x||0),0)}
  return '';
}
function panel(C,D){
  const mx=maxOf(PJ),lim=PJ.niveau_de_jeu,L=[],add=(t,ok)=>L.push(`<li class=${ok?'ok':'ko'}>${ok?'✔':'✖'} ${t}</li>`);
  const rows=[['Attributs',C.att,'v × 10 000 ; 20 000 + (v−1) × 10 000 au maximum'],['Compétences',C.compT,'2 500 par point jusqu’à 5, puis 5 000'],['Spécialisations',C.spec,'2 500 chacune'],['Connaissances',C.conn,'2 500 chacune'],['Atouts',C.at,'5 000 par niveau'],['Armes',C.arm,'2 500 (spécialiste 5 000)'],['Sorts, formes complexes',C.sorts,'5 000 chacun'],['Armure',C.armureCost,'2 500 par point'],['Équipement',C.eq,'2 500 par ligne, hors offert']];
  const over=KEYS.filter((k,i)=>mx[i]!=null&&PJ.attributs[k]>mx[i]);
  add(`Attributs au maximum : ${C.nMax} / ${lim.nb_attributs_max}`,C.nMax<=lim.nb_attributs_max);
  add('Attributs dans leur maximum'+(over.length?' ('+over.map(k=>KL[k]).join(', ')+')':''),!over.length);
  const mi=Math.max(0,...PJ.competences.filter(on).map(c=>c.indice||0));add(`Indice max : ${mi} / ${lim.indice_max_competence}`,mi<=lim.indice_max_competence);
  const rc=D.lim.comp,rs=D.lim.spec;
  add(`RR max sur une compétence : ${rc} / ${lim.rr_max_competence}`,rc<=lim.rr_max_competence);
  add(`RR max sur une spécialisation : ${rs} / ${lim.rr_max_specialisation}`,rs<=lim.rr_max_specialisation);
  add(`Essence : ${D.ess}`,D.ess>=0);add(`Nuyens restants : ${fmt(C.reste)}`,C.reste>=0);
  const bad=L.filter(x=>x.includes('class=ko')).length;$('#mini').innerHTML=`Dépensé ${fmt(C.total)} · Reste <span class="${C.reste<0?'ko':'ok'}">${fmt(C.reste)}</span>${bad?` · <span class=ko>✖ ${bad} limite(s)</span>`:''}`;
  $('#panel').innerHTML=`<section><h2>Coûts</h2><table class=ctab>${rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td>${r[2]}</td></tr>`).join('')}<tr class=tot><td>Dépensé</td><td>${fmt(C.total)}</td><td></td></tr><tr class=tot><td>Disponible</td><td>${fmt(C.dispo)}</td><td></td></tr><tr class=tot><td>Reste</td><td class="${C.reste<0?'ko':'ok'}">${fmt(C.reste)}</td><td></td></tr></table></section>
<section><h2>Limites</h2><ul>${L.join('')}</ul></section>${D.W.length?`<section><h2>Avertissements</h2><ul>${D.W.map(w=>`<li class=m>⚠ ${esc(w)}</li>`).join('')}</ul></section>`:''}`;
}
function refresh(){
  const C=costs(PJ),D=derive(PJ);
  $$('[data-v]').forEach(el=>el.textContent=vv(el.dataset.v,C));
  $$('[data-t]').forEach(el=>{el.textContent='→ '+(get(PJ,el.dataset.t)||'')});
  $$('[data-row]').forEach(el=>{const x=get(PJ,el.dataset.row),par=el.dataset.parent?get(PJ,el.dataset.parent):null;if(!x)return;el.classList.toggle('off',on(x)===false||(par&&on(par)===false))});
  $$('.pv').forEach(el=>el.style.backgroundPosition=`${PJ.identite.portrait_x??50}% ${PJ.identite.portrait_y??50}%`);
  panel(C,D);
}
function touch(rb){DIRTY=true;$('#dirty').textContent='● non enregistré';if(rb)buildForm();refresh();clearTimeout(SAVE_T);SAVE_T=setTimeout(()=>{try{localStorage.setItem('anarchy-pj',JSON.stringify(PJ))}catch(e){}},500)}
function rebuild(){buildForm();refresh()}

function upd(t){
  if(t.dataset.p){set(PJ,t.dataset.p,t.type==='checkbox'?t.checked:(t.type==='number'||t.type==='range'||t.dataset.num)?(t.value===''?0:Number(t.value)):t.value);
    const m=/^atouts\.(\d+)\.effets\.(\d+)\.(bonus\.|niveau)/.exec(t.dataset.p);
    const m2=/^armes\.(\d+)\.(vd|specialisation|monte_sur)$/.exec(t.dataset.p);
    if(m2){const w=PJ.armes[m2[1]],v=String(w[m2[2]]??'').trim();if(!v)delete w[m2[2]];else if(m2[2]==='vd')w.vd=/^\d+$/.test(v)?+v:v.toUpperCase().replace(/\s+/g,'');else w[m2[2]]=v}
    if(m){const e=PJ.atouts[m[1]].effets[m[2]];if(m[3]==='niveau')e.auto=false;else{syncEf(e);const n=$(`[data-p="atouts.${m[1]}.effets.${m[2]}.niveau"]`);if(n)n.value=e.niveau}}}
  else if(t.dataset.l){set(PJ,t.dataset.l,t.value.split('\n').map(s=>s.trim()).filter(Boolean))}
  else return;
  touch();
}
function resizeImg(file,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.88))};im.src=URL.createObjectURL(file)}
const form=$('#form');
form.addEventListener('input',e=>upd(e.target));
form.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='meta'){const I=PJ.identite;if(t.value==='Personnalisé'){const m=maxOf(PJ);PJ.attributs_max=Object.fromEntries(KEYS.map((k,i)=>[k,m[i]||4]));I.metatype=META[I.metatype]?'Personnalisé':I.metatype}else{I.metatype=t.value;PJ.attributs_max=null}touch(true)}
  else if(a==='specsel'){const s=PJ.competences[t.dataset.i].specialites[t.dataset.j],ct=catOf(PJ.competences[t.dataset.i].nom);
    if(t.value==='__autre'){s.perso=true;s.nom=''}else{s.perso=false;s.nom=t.value;const x=ct&&ct.specs.find(y=>y.nom===t.value);if(x)s.attribut=x.attribut}touch(true)}
  else if(a==='atype'){const x=PJ.atouts[t.dataset.i],v=t.value,pr=ATYPES.find(y=>y[0]===v);
    if(v==='__autre'){x.type_perso=true;x.type=''}
    else{delete x.type_perso;x.type=v;if(pr){x.niveau_base=v==='Trait'?(PJ.atouts.some((o,k)=>k!=t.dataset.i&&o.type==='Trait'&&on(o))?3:0):pr[1];x.perte_essence=pr[2]||0}
      if(v==='Cyberdeck'&&!x.stats)x.stats={firewall:0,attaque:0};if((v==='Véhicule'||v==='Drone')&&!x.stats&&!x.vehicule)x.vehicule={micro:false,volant:false,base:{structure:4,maniabilite:4,vitesse:4},plus:{autopilote:0,structure:0,maniabilite:0,vitesse:0,blindage:0}}}
    touch(true)}
  else if(a==='wcat'){PJ.armes[t.dataset.i].categorie=t.value;touch(true)}
  else if(a==='port'){const w=PJ.armes[t.dataset.i];w.portees=w.portees||['','','',''];w.portees[+t.dataset.k]=t.value;if(w.portees.every(x=>!x))delete w.portees;touch()}
  else if(a==='efadd'){const x=EFP[+t.value];if(!x)return;const at=PJ.atouts[t.dataset.i];at.effets=at.effets||[];
    let e;if(x.k==='rr'){const c=CATALOGUE[0],b={type:'rr',valeur:1,competence:c.nom,specialisation:x.spe?c.specs[0].nom:null};e={bonus:b,auto:true}}
    else if(x.k==='rra')e={bonus:{type:'rr_attribut',valeur:1,attribut:'force'},auto:true};
    else if(x.k==='vd')e={bonus:{type:'vd',valeur:1,cible:'mains nues'},auto:true};
    else if(x.k==='armure')e={bonus:{type:'armure',valeur:1,portee:'physique'},auto:true};
    else if(x.k==='case')e={bonus:{type:'case',gravite:'legere',valeur:1},auto:true};
    else e={texte:x.t,niveau:x.n};
    if(e.bonus)syncEf(e);at.effets.push(e);touch(true)}
  else if(a==='rrc'){const b=PJ.atouts[t.dataset.i].effets[t.dataset.j].bonus;
    if(t.value==='__autre'){b.perso_comp=true;b.competence=''}else{delete b.perso_comp;b.competence=t.value}
    b.specialisation=null;delete b.perso_spec;syncEf(PJ.atouts[t.dataset.i].effets[t.dataset.j]);touch(true)}
  else if(a==='rrs'){const e=PJ.atouts[t.dataset.i].effets[t.dataset.j],b=e.bonus;
    if(t.value==='__autre'){b.perso_spec=true;b.specialisation=''}else{delete b.perso_spec;b.specialisation=t.value||null}
    syncEf(e);touch(true)}
  else if(t.id==='pic'){if(t.files[0])resizeImg(t.files[0],d=>{PJ.identite.portrait=d;touch(true)})}
  else upd(t);
});
form.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j;
  if(a==='addspec'){const c=PJ.competences[i];c.actif=true;c.specialites.push({nom:'',actif:true,attribut:c.attribut})}
  else if(a==='delspec')PJ.competences[i].specialites.splice(j,1);
  else if(a==='addcomp')PJ.competences.push({nom:'',actif:true,perso:true,attribut:'logique',indice:0,specialites:[]});
  else if(a==='delcomp')PJ.competences.splice(i,1);
  else if(a==='addarme')PJ.armes.push({nom:'',actif:true,categorie:'arme'});
  else if(a==='delarme')PJ.armes.splice(i,1);
  else if(a==='addcontact')PJ.contacts.push({nom:'',type:'',description:'',actif:true});
  else if(a==='delcontact')PJ.contacts.splice(i,1);
  else if(a==='addequip')PJ.equipement.push({nom:'',actif:true,offert:false});
  else if(a==='delequip')PJ.equipement.splice(i,1);
  else if(a==='addatout')PJ.atouts.push({type:'',nom:'',actif:true,niveau_base:0,effets:[]});
  else if(a==='delatout')PJ.atouts.splice(i,1);
  else if(a==='delef')PJ.atouts[i].effets.splice(j,1);
  else if(a==='addconn')PJ.connaissances.push({nom:'',actif:true});
  else if(a==='delconn')PJ.connaissances.splice(i,1);
  else if(a==='nopic')delete PJ.identite.portrait;
  else if(a==='preset'){const v=NIV[b.dataset.v];NIVK.forEach((k,n)=>PJ.niveau_de_jeu[k]=v[n])}
  else return;
  touch(true);
});

/* ---------------- onglets, fichiers ---------------- */
const AVAIL=(297-16-9)*96/25.4;
function fitPages(){
  const sh=document.querySelector('#out .sheet');if(!sh)return;
  [['.pg1',.7],['.p2',.7]].forEach(([q,min])=>{
    const el=sh.querySelector(q);if(!el)return;el.style.zoom='';
    const box=document.createElement('div');box.style.cssText='position:absolute;left:-99999px;top:0;width:192mm;visibility:hidden';
    const cl=el.cloneNode(true);cl.classList.add('meas');box.appendChild(cl);document.body.appendChild(box);
    const hh=()=>cl.getBoundingClientRect().height;let z=1,h=hh();
    while(h>AVAIL&&z>min){z=Math.max(min,z*Math.min(.98,AVAIL/h));cl.style.zoom=z;h=hh()}
    document.body.removeChild(box);if(z<1)el.style.zoom=z;
  });
}
function showTab(t){
  $('#crea').hidden=t!=='crea';$('#mini').hidden=t!=='crea';$('#fiche').hidden=t!=='fiche';
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$('#bprint').hidden=t!=='fiche';
  if(t==='crea'&&PJ)buildForm(),refresh();
  if(t==='fiche'){render(PJ);fitPages();document.title=(PJ.identite.pseudo||'Fiche')+' – fiche Anarchy'}
}
function setPJ(p){PJ=normalize(p);DIRTY=false;$('#dirty').textContent='';rebuild();if(!$('#fiche').hidden)showTab('fiche')}
function openText(t){
  try{const p=JSON.parse(t);
    if(p.format==='anarchy-fiche-gsheet')throw Error('Ancien format : réexporte la feuille avec ExportPJ.gs.');
    if(p.format!=='anarchy-pj')throw Error('Format inconnu (attendu : anarchy-pj).');
    setPJ(p);$('#msg').textContent='';try{localStorage.setItem('anarchy-pj',JSON.stringify(PJ))}catch(e){}
  }catch(e){$('#msg').textContent='Erreur : '+e.message}
}
function save(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(PJ,null,2)],{type:'application/json'}));
  a.download=(PJ.identite.pseudo||'pj').replace(/[^\w\-]+/g,'_')+'.json';a.click();DIRTY=false;$('#dirty').textContent='';
}
$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
addEventListener('beforeprint',fitPages);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$('#fiche').hidden)fitPages()});
$('#mini').onclick=()=>$('#panel').scrollIntoView({behavior:'smooth'});
$('#bsave').onclick=save;$('#bprint').onclick=()=>print();
$('#bnew').onclick=()=>{if(!DIRTY||confirm('Abandonner les modifications non enregistrées ?'))setPJ({})};
$('#fopen').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(openText);e.target.value=''};
addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
let init=null;try{init=JSON.parse(localStorage.getItem('anarchy-pj')||'null')}catch(e){}
setPJ(init&&init.format==='anarchy-pj'?init:{});

</script></body></html>
